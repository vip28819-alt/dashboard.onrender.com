services:
  - type: web
    name: server-control-dashboard
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_PUBLIC_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_TOKEN
        sync: false
